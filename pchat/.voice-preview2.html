<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/chat.css">
<style>body{background:#080c15;padding:60px;font-family:Inter,system-ui,sans-serif}.box{width:430px}.voice-rec-enhance-row{display:flex}</style>

<div class="box">

    <button type="button" class="voice-rec-enhance is-working" style="--p:.62">
      <span class="vre-ico" aria-hidden="true">
        <svg class="vre-ring" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="vre-ring-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"></stop><stop offset="0.55" stop-color="#818cf8"></stop><stop offset="1" stop-color="#c084fc"></stop></linearGradient></defs><circle class="vre-ring-track" cx="16" cy="16" r="13.5"></circle><circle class="vre-ring-fill" cx="16" cy="16" r="13.5"></circle></svg>
        <svg class="vre-ico-spark" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 2.2l1.6 4.6 4.6 1.6-4.6 1.6-1.6 4.6-1.6-4.6L5.3 8.4l4.6-1.6z"></path><path d="M18.8 13.6l.9 2.5 2.5.9-2.5.9-.9 2.5-.9-2.5-2.5-.9 2.5-.9z"></path><path d="M5.6 15.4l.6 1.7 1.7.6-1.7.6-.6 1.7-.6-1.7-1.7-.6 1.7-.6z"></path></svg>
        <svg class="vre-ico-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </span>
      <span class="vre-text">Balancing volume…</span>
      <span class="vre-eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </div>
</div>
</body></html>
