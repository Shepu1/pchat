<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice card test</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/chat.css" />
<link rel="stylesheet" href="css/responsive.css" />
<style>
  body { background: #070a12; margin: 0; }
  .harness { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  #chat-feed { flex: 1; overflow: auto; }
  #log { position: fixed; top: 8px; left: 8px; right: 8px; max-height: 28vh; overflow: auto; font: 11px/1.4 monospace; color: #9fb3c8; background: rgba(0,0,0,.55); padding: 6px; border-radius: 8px; z-index: 9999; white-space: pre-wrap; }
  #log, #attach-file-input, #attach-btn, #send-btn,
  #cancel-reply-btn, #edit-modal-close, #edit-cancel-btn, #edit-save-btn,
  #delete-modal-close, #delete-cancel-btn, #delete-confirm-btn,
  #leave-modal-close, #leave-cancel-btn, #leave-confirm-btn { display: none !important; }
</style>
</head>
<body>
<pre id="log"></pre>
<div class="harness">
  <div id="chat-feed"></div>

  <div class="voice-rec hidden" id="voice-rec" role="group" aria-label="Voice message">
    <div class="voice-rec-head">
      <span class="voice-rec-dot" aria-hidden="true"></span>
      <span class="voice-rec-label" id="voice-rec-label">Recording</span>
      <span class="voice-rec-time" id="voice-rec-time">0:00</span>
    </div>
    <div class="voice-rec-body">
      <button type="button" class="voice-rec-play hidden" id="voice-rec-play" aria-label="Play recording">
        <svg class="voice-rec-icon-play" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="8 5 19 12 8 19"></polygon></svg>
        <svg class="voice-rec-icon-pause" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
      </button>
      <div class="voice-rec-wave" id="voice-rec-wave" aria-hidden="true"></div>
    </div>
    <div class="voice-rec-actions">
      <button type="button" class="voice-rec-btn voice-rec-discard" id="voice-rec-cancel" aria-label="Discard recording" title="Discard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <button type="button" class="voice-rec-btn voice-rec-send hidden" id="voice-rec-send" aria-label="Send voice message" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
      <button type="button" class="voice-rec-btn voice-rec-stop" id="voice-rec-stop" aria-label="Stop recording" title="Stop">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"></rect></svg>
      </button>
    </div>
  </div>

  <div class="attachment-preview-bar hidden" id="attachment-preview-bar">
    <img id="attachment-thumb" class="attachment-preview-thumb hidden" alt="Preview" />
    <div id="attachment-file-icon" class="msg-file-icon" style="display:none;"></div>
    <div class="attachment-preview-info">
      <div class="attachment-preview-name" id="attachment-name">file.png</div>
      <div class="attachment-preview-size" id="attachment-size">0 KB</div>
    </div>
    <button class="btn btn-icon btn-ghost" id="cancel-attachment-btn" aria-label="Remove attachment">x</button>
  </div>

  <div class="reply-bar hidden" id="reply-bar"></div>

  <div class="chat-input-bar" id="chat-input-bar">
    <div class="chat-input-row">
      <input type="file" id="attach-file-input" />
      <button class="chat-input-side-btn" id="attach-btn">+</button>
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chat-input" rows="1" placeholder="Message…"></textarea>
        <div class="chat-input-actions">
          <button class="chat-input-btn" id="voice-btn" aria-label="Record voice message"><svg width="18" height="18"></svg></button>
        </div>
      </div>
      <button id="send-btn">send</button>
    </div>
  </div>

  <div id="msg-context-menu" style="display:none">
    <button id="ctx-reply">r</button><button id="ctx-copy">c</button><button id="ctx-edit">e</button><button id="ctx-delete">d</button>
  </div>
  <button id="cancel-reply-btn">x</button>
  <button id="edit-modal-close">x</button><button id="edit-cancel-btn">x</button><button id="edit-save-btn">s</button>
  <button id="delete-modal-close">x</button><button id="delete-cancel-btn">x</button><button id="delete-confirm-btn">d</button>
  <button id="leave-modal-close">x</button><button id="leave-cancel-btn">x</button><button id="leave-confirm-btn">l</button>
  <div id="typing-indicator" class="hidden"></div>
  <button id="scroll-to-bottom-btn" class="hidden"></button>
  <div id="lightbox-modal" class="hidden"></div>
</div>

<script>
  window.__log = [];
  const log = (m) => { window.__log.push(m); document.getElementById('log').textContent = window.__log.join('\n'); };
  window.addEventListener('error', (e) => log('ERROR: ' + e.message + '\n' + ((e.error && e.error.stack) || '')));

  // The preview window can be backgrounded, where rAF is paused; drive it
  // from timers so the harness still exercises the real drawing loop.
  window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
  window.cancelAnimationFrame = (id) => clearTimeout(id);

  window.UI = { toast: (t, a, m) => log('toast: ' + t + ' | ' + a + ' | ' + m), formatBytes: (b) => (Math.round((b || 0) / 1024) + ' KB'), setStatus: () => {}, autoResize: () => {}, copyText: async () => {}, closeModal: () => {}, openModal: () => {} };
  window.CONFIG = { MAX_MESSAGE_LENGTH: 4000 };
  window.Crypto = { randomBase62: (n) => 'x'.repeat(n || 8) };
  window.Storage = { getSession: () => null, getRooms: () => [], getCurrentRoom: () => null, clearSession() {}, clearCurrentRoom() {} };
  window.Rooms = { getRoom: () => null, removeRoom: () => {} };
  window.RoomAPI = { join: async () => ({ success: false }) };
  window.Auth = { isAuthenticated: () => false };
  window.Sheets = {};
  window.RoomMusic = undefined;
  window.ShepuBot = undefined;
  window.Encryption = undefined;

  const fakeStream = { getTracks: () => [{ stop() {} }] };
  Object.defineProperty(navigator.mediaDevices, 'getUserMedia', { value: async () => fakeStream, configurable: true, writable: true });

  function makeWavBlob(seconds) {
    const rate = 8000, n = Math.floor(rate * seconds);
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.round(Math.sin(i / 6) * 9000), true);
    return new Blob([buf], { type: 'audio/wav' });
  }
  window.__wav = makeWavBlob(2);

  class FakeRecorder {
    constructor(stream, opts) { this.stream = stream; this.mimeType = (opts && opts.mimeType) || 'audio/wav'; this.state = 'inactive'; }
    static isTypeSupported() { return true; }
    start() { this.state = 'recording'; }
    stop() {
      this.state = 'inactive';
      if (this.ondataavailable) this.ondataavailable({ data: window.__wav });
      if (this.onstop) this.onstop();
    }
  }
  window.MediaRecorder = FakeRecorder;

  window.AudioContext = class {
    createMediaStreamSource() { return { connect() {} }; }
    createAnalyser() {
      return {
        fftSize: 0, smoothingTimeConstant: 0, frequencyBinCount: 256,
        connect() {},
        getByteTimeDomainData(arr) {
          // speech-like bursts so the wave is not a flat line
          const t = performance.now();
          const env = 0.22 + 0.78 * Math.abs(Math.sin(t / 620) * Math.sin(t / 137));
          const amp = 6 + 66 * env;
          for (let i = 0; i < arr.length; i++) arr[i] = 128 + Math.round(Math.sin(i / 2.5 + t / 60) * amp);
        },
      };
    }
    close() {}
  };
</script>
<script src="js/chat.js"></script>
<script>
  Chat.init({ id: 'r1', name: 'Test Room', deploymentUrl: '' }, { memberId: 'm1', displayName: 'Me', role: 'member' });
  log('chat initialised');
  window.__card = () => document.getElementById('voice-rec');
  window.__state = () => ({
    hidden: window.__card().classList.contains('hidden'),
    recording: window.__card().classList.contains('is-recording'),
    preview: window.__card().classList.contains('is-preview'),
    label: document.getElementById('voice-rec-label').textContent,
    time: document.getElementById('voice-rec-time').textContent,
    playHidden: document.getElementById('voice-rec-play').classList.contains('hidden'),
    sendHidden: document.getElementById('voice-rec-send').classList.contains('hidden'),
    stopHidden: document.getElementById('voice-rec-stop').classList.contains('hidden'),
    bars: document.querySelectorAll('.voice-rec-bar').length,
    heights: Array.from(document.querySelectorAll('.voice-rec-bar')).slice(0, 8).map(b => b.style.height),
    played: document.querySelectorAll('.voice-rec-bar.played').length,
    playing: document.getElementById('voice-rec-play').classList.contains('is-playing'),
  });
</script>
</body>
</html>
