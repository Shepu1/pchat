<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCHAT</title>
  <meta name="description" content="PCHAT - Loading your chat experience.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Ctext x='50' y='66' font-size='52' font-family='Arial' font-weight='700' text-anchor='middle' fill='%2338bdf8'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="prefetch" href="./pchat/index.html" as="document">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      display:flex;align-items:center;justify-content:center;
      background:#0f172a;color:#e2e8f0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .loader{text-align:center;animation:fade .5s ease both}
    .logo{font-size:28px;font-weight:700;letter-spacing:6px;margin-bottom:26px;padding-left:6px}
    .spinner{
      width:34px;height:34px;margin:0 auto;
      border:3px solid rgba(255,255,255,.12);
      border-top-color:#38bdf8;border-radius:50%;
      animation:spin .8s linear infinite;
    }
    .msg{margin-top:18px;font-size:13px;color:#94a3b8;letter-spacing:.5px}
    .msg a{color:#38bdf8;text-decoration:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){
      .spinner{animation-duration:2s}
      .loader{animation:none}
    }
  </style>
  <script>
    window.location.replace("./pchat/" + window.location.search + window.location.hash);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=./pchat/">
  </noscript>
</head>
<body>
  <main class="loader" role="status" aria-live="polite">
    <div class="logo">PCHAT</div>
    <div class="spinner" aria-hidden="true"></div>
    <noscript><p class="msg"><a href="./pchat/">Continue to PCHAT</a></p></noscript>
  </main>
</body>
</html>
